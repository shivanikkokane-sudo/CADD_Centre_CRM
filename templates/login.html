{% extends "base.html" %}
{% block title %}Login · Skillverse CRM{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-mark">S</div>
  <p class="eyebrow">Dadar Centre</p>
  <h1>Welcome back</h1>
  <p class="muted">Sign in to manage enquiries and follow-ups.</p>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary full" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
